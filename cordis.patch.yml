# dsh-plugin-media-index — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "mediaindex".
# Tools resultantes: mcp__mediaindex__* (ver README).
- insert:
    - id: mcp-media-index
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mediaindex
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/media-index/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
